services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: unicodeit-web:latest
    container_name: unicodeit-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - app_plane
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=app_plane"
      - "traefik.http.routers.unicodeit.rule=Host(`unicodeit.com`) || Host(`www.unicodeit.com`)"
      - "traefik.http.routers.unicodeit.entrypoints=web"
      - "traefik.http.routers.unicodeit.middlewares=unicodeit-redirect"
      - "traefik.http.middlewares.unicodeit-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.unicodeit-https.rule=Host(`unicodeit.com`) || Host(`www.unicodeit.com`)"
      - "traefik.http.routers.unicodeit-https.entrypoints=websecure"
      - "traefik.http.routers.unicodeit-https.tls=true"
      - "traefik.http.routers.unicodeit-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.unicodeit-svc.loadbalancer.server.port=3000"

networks:
  app_plane:
    external: true
    name: app_plane
