services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: unicodeit-web:latest
    container_name: unicodeit-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
